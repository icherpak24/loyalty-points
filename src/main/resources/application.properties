spring.application.name=loyalty-points

# SQLite database file. Override with the LOYALTY_DB environment variable.
loyalty.db.path=${LOYALTY_DB:loyalty.db}

# Run schema.sql on every start-up. It is idempotent (CREATE ... IF NOT EXISTS, INSERT OR IGNORE).
spring.sql.init.mode=always

server.port=7070

# Reject request bodies with unexpected fields rather than silently ignoring them.
spring.jackson.deserialization.fail-on-unknown-properties=true
